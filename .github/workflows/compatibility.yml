name: Shell compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Make native OpenSSL available
        run: |
          $openssl = 'C:\Program Files\OpenSSL\bin'
          if (Test-Path $openssl) { $openssl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: Build release files
        run: python scripts/build.py
      - name: Test native Windows edition
        run: |
          & ./tests/test_windows.ps1
          & ./tests/test_windows.ps1 -ScriptPath ./release/certKeys.ps1
      - name: Test CMD launcher
        run: |
          python tests/test_windows_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_windows_launcher.py release/certKeys.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash openssl openssh-client python3 ca-certificates git
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n src/certKeys src/LScriptLibV1.sh
      - name: Run compatibility tests
        run: python3 tests/test_compatibility.py
      - name: Build and test standalone executable
        run: |
          python3 scripts/build.py
          bash -n release/certKeys
          python3 tests/test_compatibility.py release/certKeys
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check system Bash syntax
        run: /bin/bash -n src/certKeys src/LScriptLibV1.sh
      - name: Run compatibility tests with system Bash
        run: python3 tests/test_compatibility.py
      - name: Build and test standalone executable with system Bash
        run: |
          python3 scripts/build.py
          /bin/bash -n release/certKeys
          python3 tests/test_compatibility.py release/certKeys
